<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | ElderCare+</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top left, #e8f0ff, #f7f9ff);
        }

        /* ===== Login Card ===== */
        .login-box {
            width: 450px;
            padding: 42px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow:
                0 20px 45px rgba(31, 60, 136, 0.15),
                inset 0 0 0 1px rgba(31, 60, 136, 0.08);
            backdrop-filter: blur(10px);
        }

        h2 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 26px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        h2 span {
            margin-right: 6px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 500;
            color: #2c2c2c;
        }

        /* ===== AI-STYLE INPUT ===== */
        .input-wrap {
            position: relative;
            margin-top: 6px;
        }

        input {
            width: 420px;
            padding: 13px 14px;
            border-radius: 12px;
            border: 1.5px solid #cfd8ee;
            font-size: 14px;
            outline: none;
            background: linear-gradient(180deg, #fbfcff, #f6f8ff);
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: #1f3c88;
            background: #ffffff;
            box-shadow:
                0 0 0 3px rgba(31, 60, 136, 0.15),
                0 8px 20px rgba(31, 60, 136, 0.12);
        }

        .error-text {
            font-size: 12.5px;
            color: #e53935;
            margin-top: 6px;
            display: none;
        }

        /* ===== Button ===== */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 28px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1f3c88, #244fbb);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(31, 60, 136, 0.35);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(31, 60, 136, 0.45);
        }

        button:disabled {
            background: #b5c1e4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .server-error {
            text-align: center;
            color: #e53935;
            margin-bottom: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2><span>🛡️</span>Admin Login</h2>

    {% if message %}
        <div class="server-error">{{ message }}</div>
    {% endif %}

    <form method="POST" onsubmit="return validateForm()">

        <label>Username</label>
        <div class="input-wrap">
            <input type="text" id="username" name="username" placeholder="Enter admin username">
        </div>
        <div class="error-text" id="userError">Username must be at least 3 characters</div>

        <label>Password</label>
        <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Enter admin password">
        </div>
        <div class="error-text" id="passError">Password must be at least 4 characters</div>

        <button type="submit" id="loginBtn">Login</button>
    </form>
</div>

<script>
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const userError = document.getElementById("userError");
    const passError = document.getElementById("passError");

    function validateForm() {
        let valid = true;

        if (username.value.trim().length < 3) {
            userError.style.display = "block";
            valid = false;
        } else {
            userError.style.display = "none";
        }

        if (password.value.trim().length < 4) {
            passError.style.display = "block";
            valid = false;
        } else {
            passError.style.display = "none";
        }

        return valid;
    }

    username.addEventListener("input", validateForm);
    password.addEventListener("input", validateForm);
</script>

</body>
</html>
