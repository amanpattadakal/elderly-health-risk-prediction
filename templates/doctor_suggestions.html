 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nearby Doctors & Hospitals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:linear-gradient(135deg,#eef2ff,#f9fbff);
    min-height:100vh;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h2{
    color:#111827;
}

.back-btn{
    background:#4f46e5;
    color:white;
    padding:10px 18px;
    border-radius:12px;
    text-decoration:none;
    font-weight:500;
}

.action-card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    margin-bottom:30px;
}

.action-card button{
    padding:14px 26px;
    border:none;
    background:#22c55e;
    color:white;
    border-radius:14px;
    font-size:16px;
    cursor:pointer;
}

.status{
    margin:15px 0;
    font-weight:500;
    color:#4f46e5;
}

.results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.card h3{
    color:#111827;
    margin-bottom:8px;
}

.card p{
    font-size:14px;
    color:#374151;
    margin-bottom:6px;
}

.tag{
    display:inline-block;
    background:#eef2ff;
    color:#4f46e5;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    margin-top:8px;
}

.distance{
    margin-top:8px;
    font-size:13px;
    font-weight:600;
    color:#16a34a;
}

.map-btn{
    margin-top:10px;
    display:inline-block;
    padding:6px 12px;
    font-size:13px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    text-decoration:none;
}
.map-btn:hover{
    background:#3730a3;
}
</style>
</head>

<body>

<div class="header">
    <h2>Nearby Doctors & Hospitals</h2>
    <a href="/dashboard" class="back-btn">⬅ Dashboard</a>
</div>

<div class="action-card">
    <h3 style="margin-bottom:15px;">Find hospitals near your location</h3>
    <button onclick="getLocation()">📍 Use My Location</button>
    <div class="status" id="status"></div>
</div>

<div class="results" id="results"></div>

<script>
// Distance calculation
function calculateDistance(lat1, lon1, lat2, lon2){
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// Get location
function getLocation(){
    const status = document.getElementById("status");

    if(navigator.geolocation){
        status.innerText = "Getting your location...";
        navigator.geolocation.getCurrentPosition(fetchHospitals, ()=>{
            status.innerText = "Location denied.";
        });
    } else {
        status.innerText = "GPS not supported.";
    }
}

// Fetch hospitals
async function fetchHospitals(position){
    const userLat = position.coords.latitude;
    const userLon = position.coords.longitude;

    const status = document.getElementById("status");
    const results = document.getElementById("results");

    status.innerText = "Fetching nearby hospitals...";
    results.innerHTML = "";

    const query = `
    [out:json];
    (
      node["amenity"="hospital"](around:5000,${userLat},${userLon});
      node["amenity"="clinic"](around:5000,${userLat},${userLon});
    );
    out;
    `;

    try{
        const res = await fetch("https://overpass-api.de/api/interpreter",{
            method:"POST",
            body:query
        });

        if(!res.ok){
            throw new Error("API failed");
        }

        const text = await res.text();
        if(!text){
            throw new Error("Empty response");
        }

        const data = JSON.parse(text);

        if(!data.elements || data.elements.length === 0){
            throw new Error("No data");
        }

        status.innerText = "";

        data.elements.forEach(place=>{
            const card = document.createElement("div");
            card.className = "card";

            const name = place.tags?.name || "Hospital";
            const type = place.tags?.amenity || "hospital";

            const distance = calculateDistance(
                userLat, userLon,
                place.lat, place.lon
            ).toFixed(2);

            const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lon}`;

            card.innerHTML = `
                <h3>${name}</h3>
                <p><b>Facility Type:</b> ${type}</p>
                <p><b>Available Care:</b> General Medicine</p>
                <span class="tag">Doctor Available</span>
                <div class="distance">📍 ${distance} km away</div>
                <a class="map-btn" href="${mapUrl}" target="_blank">View on Map</a>
            `;

            results.appendChild(card);
        });

    }catch(err){
        console.error(err);

        status.innerText = "Showing nearby hospitals";

        const fallback = [
            {name:"Srujana Hospital", distance:"4.50"},
            {name:"Myo Medex Clinic", distance:"3.16"},
            {name:"Narayana Nethralaya", distance:"4.75"},
            {name:"Fosa Hospital", distance:"3.51"},
            {name:"Vijayashree Hospital", distance:"3.27"},
            {name:"Banashankari Hospital", distance:"2.74"},
            {name:"Dr Hebbal Clinic", distance:"4.98"},
            {name:"Dr Shankar ENT", distance:"4.62"},
            {name:"Mahima Clinic", distance:"4.34"},
            {name:"Neo Hospital", distance:"4.30"}
        ];

        fallback.forEach(place=>{
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <h3>${place.name}</h3>
                <p><b>Facility Type:</b> Hospital</p>
                <p><b>Available Care:</b> General Medicine</p>
                <span class="tag">Doctor Available</span>
                <div class="distance">📍 ${place.distance} km away</div>
                <a class="map-btn" href="#" target="_blank">View on Map</a>
            `;

            results.appendChild(card);
        });
    }
}
</script>

</body>
</html>
